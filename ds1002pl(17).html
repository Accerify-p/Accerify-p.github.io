<style>*{margin:0;padding:0}html,body{height:100%;overflow:hidden;background:#05070f;touch-action:none}canvas{display:block}</style>
</head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');
let W,H,gy,stars=[],parts=[],btns=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;gy=H-60;stars=[];for(let i=0;i<150;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,s:Math.random()*1.4+.3});layout()}

let ac,mu;
function au(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();mu=ac.createGain();mu.gain.value=.035;mu.connect(ac.destination);let o=ac.createOscillator();o.type='sawtooth';o.frequency.value=110;o.connect(mu);o.start();let l=ac.createOscillator();l.frequency.value=.2;let lg=ac.createGain();lg.gain.value=30;l.connect(lg);lg.connect(o.frequency);l.start()}
function bp(f,d,v){if(!ac)return;let o=ac.createOscillator(),n=ac.createGain();o.type='square';o.frequency.value=f;n.gain.value=v||.04;o.connect(n);n.connect(ac.destination);o.start();n.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}
function burst(x,y,co,n,sp){sp=sp||3.5;for(let i=0;i<n;i++){let a=Math.random()*6.28,s=1+Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,co,r:2+Math.random()*2})}}

const pools=[['s','s','d','d','t','t'],['s','s','d','d','t','t','h','h','r','w','w'],['s','s','d','d','t','t','h','h','r','w','w','a','a','p','p']];
const dn=['简单','中等','困难'],dd=[.75,1,1.3],dc=[1.5,1,.8];
let diff=0,state='menu';
let p={x:0,y:0,r:16},bullets=[],enemies=[],eb=[],score=0,fireT=0,spT=0,hold=false,lives=5,maxLives=5,inv=0,sh=0,cd=0,kills=0,tm=0,boss=null,bossThreshold=4500,warnT=0,healFx=0;
function reset(){p.x=W/2;p.y=H-90;bullets=[];enemies=[];eb=[];parts=[];score=0;fireT=0;spT=0;lives=5;inv=0;sh=0;cd=0;kills=0;tm=0;boss=null;bossThreshold=4500;warnT=0;healFx=0}
reset();
function board(){try{return JSON.parse(localStorage.getItem('planeTop10')||'[]')}catch(e){return[]}}
function saveScore(){let b=board();b.push({score,kills,time:+tm.toFixed(1),diff:dn[diff]});b.sort((a,b)=>b.score-a.score);localStorage.setItem('planeTop10',JSON.stringify(b.slice(0,10)))}
function sb(x,y){return Math.hypot(x-(W-60),y-(H-60))<40}
function use(){if(cd<=0&&sh<=0&&state==='play'){sh=300;cd=1200;bp(880,.3,.06);burst(p.x,p.y,'#4af',32,5)}}
function setPos(x,y,off){p.x=Math.max(p.r,Math.min(W-p.r,x));p.y=Math.max(p.r,Math.min(H-p.r,y-off))}
function down(x,y,off){
au();
if(state==='menu'){for(const b of btns)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){diff=b.d;reset();state='play';return}return}
if(state==='over'){state='menu';return}

hold=true;setPos(x,y,off)}
c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];down(t.clientX,t.clientY,50)},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(hold&&state==='play'){const t=e.touches[0];setPos(t.clientX,t.clientY,50)}},{passive:false});

c.addEventListener('mousedown',e=>down(e.clientX,e.clientY,0));

function efire(e){let sp=3.3+score/1200,t=e.type;
if(t=='s')eb.push({x:e.x,y:e.y+e.r,vx:0,vy:sp});
else if(t=='d'){eb.push({x:e.x-8,y:e.y+e.r,vx:0,vy:sp});eb.push({x:e.x+8,y:e.y+e.r,vx:0,vy:sp})}
else if(t=='t')for(let a=-.3;a<=.31;a+=.3)eb.push({x:e.x,y:e.y+e.r,vx:Math.sin(a)*sp,vy:Math.cos(a)*sp});
else if(t=='h'){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;eb.push({x:e.x,y:e.y+e.r,vx:dx/d*sp*.85,vy:dy/d*sp*.85})}

else if(t=='w')for(let i=-1;i<2;i++)eb.push({x:e.x+i*22,ox:e.x+i*22,y:e.y+e.r,vx:0,vy:sp*.9,ph:i*1.2,ty:'w'});
else if(t=='a')eb.push({x:e.x,y:e.y+e.r,vx:0,vy:sp*.5,ty:'a'});

function spawnBoss(){

function updateBoss(dt){
if(!boss)return;

if(boss.y<110)boss.y+=1.8*dt;
else{boss.x+=boss.dir*(0.9+boss.phase*0.5)*dt;
 if(boss.x>W-boss.r){boss.x=W-boss.r;boss.dir=-1}
 if(boss.x<boss.r){boss.x=boss.r;boss.dir=1}}
if(boss.flash>0)boss.flash-=dt;
if(boss.rage>0)boss.rage-=dt;
let ratio=boss.hp/boss.maxHp;
let ph=ratio>0.66?0:ratio>0.33?1:2;
if(ph!==boss.phase){boss.phase=ph;bp(200,.4,.08);burst(boss.x,boss.y,'#f6a',40,6);boss.cd=30;boss.rage=60}
if(boss.y>60){boss.cd-=dt;if(boss.cd<=0)bossFire()}}

 if(r<0.55){

   eb.push({x:boss.x,y:boss.y+20,vx:Math.cos(base+a)*sp,vy:Math.sin(base+a)*sp,big:1,co:'#f6a'});

 }else{
  for(let i=0;i<8;i++){let a=boss.t*0.02+i*6.28/8;
   eb.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp*0.7,vy:Math.sin(a)*sp*0.7,big:1,co:'#c6f'})}
  boss.cd=60}
}else if(boss.phase===1){
 if(r<0.4){

   eb.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp*0.8,vy:Math.sin(a)*sp*0.8,big:1,co:'#c6f'})}
  boss.cd=50;

  boss.cd=45;
 }else{
  for(let i=-1;i<=1;i++){
   let off=i*30;
   eb.push({x:boss.x+off,ox:boss.x+off,y:boss.y+20,vx:0,vy:sp*0.9,ph:i*1.5,ty:'w',big:1,co:'#8cf'})}
  boss.cd=55}
}else{
 if(r<0.35){

   eb.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,big:1,co:'#f55'})}

 for(let e of enemies)if(Math.hypot(p.x-e.x,p.y-e.y)<e.r+p.r-4)hurt();

g.globalAlpha=1;g.globalCompositeOperation='source-over';g.shadowBlur=0;
g.shadowBlur=18;g.shadowColor='#f80';g.strokeStyle='#f80';g.lineWidth=3;

if(boss){
