<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>飞机大战</title>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="hudLeft">
    <div class="score-line">分数 <b id="hScore">0</b></div>
    <div class="meta-line" id="hMeta">Lv1 · DMG1 · 简单</div>
    <div class="xp-bar"><i id="hXp"></i></div>
    <div class="boss-cd" id="hBossCd"></div>
  </div>
  <div class="lives" id="hLives"></div>
  <button id="skillBtn">⚡</button>
  <div class="boss-bar" id="bossBar">
    <div class="seg"><i></i></div><div class="seg"><i></i></div><div class="seg"><i></i></div>
  </div>
  <div class="boss-label" id="bossLabel"></div>
</div>

<div class="overlay" id="ovMenu">
  <div class="panel">
    <h1>飞机大战</h1>
    <p class="sub">选择难度</p>
    <button data-d="0">简单</button>
    <button data-d="1">中等</button>
    <button data-d="2">困难</button>
    <button class="gold" data-a="board">🏆 排行榜</button>
    <p class="hint">WASD 移动 · 空格 / J / K 放技能</p>
  </div>
</div>

<div class="overlay" id="ovBoard">
  <div class="panel">
    <h2>🏆 历史最佳</h2>
    <div class="board-table" id="boardTable"></div>
    <button data-a="menu">返回菜单</button>
  </div>
</div>

<div class="overlay" id="ovOver">
  <div class="panel">
    <h2>游戏结束</h2>
    <p class="over-stat" id="overStat"></p>
    <h3>历史最佳</h3>
    <div class="board-table" id="overBoard"></div>
    <button data-a="menu">返回菜单</button>
  </div>
</div>

<script src="game.js"></script>
</body></html>
