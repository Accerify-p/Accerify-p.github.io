<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>飞机大战</title>
<style>*{margin:0;padding:0}html,body{height:100%;overflow:hidden;background:#05070f;touch-action:none}canvas{display:block}</style>
</head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');
let W,H,gy,stars=[],parts=[],btns=[],now=0;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;gy=H-60;stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,s:Math.random()*1.2+.3});layout()}
function layout(){btns=[];const bw=Math.min(220,W*.7),bh=50,gap=14,tot=4*bh+3*gap;let sy=H/2-tot/2+20;for(let i=0;i<4;i++)btns.push({x:W/2-bw/2,y:sy+i*(bh+gap),w:bw,h:bh,d:i})}
rs();addEventListener('resize',rs);
let ac,mu;
function au(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();mu=ac.createGain();mu.gain.value=.03;mu.connect(ac.destination);let o=ac.createOscillator();o.type='sawtooth';o.frequency.value=110;o.connect(mu);o.start();let l=ac.createOscillator();l.frequency.value=.2;let lg=ac.createGain();lg.gain.value=30;l.connect(lg);lg.connect(o.frequency);l.start()}
function bp(f,d,v){if(!ac)return;let o=ac.createOscillator(),n=ac.createGain();o.type='square';o.frequency.value=f;n.gain.value=v||.035;o.connect(n);n.connect(ac.destination);o.start();n.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}
function burst(x,y,co,n,sp){if(parts.length>90)return;sp=sp||3.2;n=Math.min(n,10);for(let i=0;i<n;i++){let a=Math.random()*6.28,s=1+Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,co,r:2+Math.random()*2})}}
const cfg={s:{sc:10,co:'#f55',hp:1},d:{sc:15,co:'#f88',hp:1},t:{sc:20,co:'#fa5',hp:1},h:{sc:25,co:'#c6f',hp:2},r:{sc:25,co:'#ff3',hp:2},w:{sc:30,co:'#8cf',hp:2},a:{sc:30,co:'#4fa',hp:2},p:{sc:40,co:'#f6a',hp:3}};
const pools=[['s','s','d','d','t','t'],['s','s','d','d','t','t','h','h','r','w','w'],['s','s','d','d','t','t','h','h','r','w','w','a','a','p','p']];
const dn=['简单','中等','困难'],dd=[.75,1,1.3],dc=[1.5,1,.8];
const LV_STEP=320;
let diff=0,state='menu',prevLv=1;
let p={x:0,y:0,r:16},bullets=[],enemies=[],eb=[],score=0,fireT=0,spT=0,hold=false,lives=3,maxLives=7,inv=0,sh=0,cd=0,kills=0,tm=0,boss=null,bossThreshold=4000,warnT=0,healFx=0;
function reset(){p.x=W/2;p.y=H-90;bullets=[];enemies=[];eb=[];parts=[];score=0;fireT=0;spT=0;lives=3;inv=0;sh=0;cd=0;kills=0;tm=0;boss=null;bossThreshold=4000;warnT=0;healFx=0;prevLv=1}
reset();
function board(){try{return JSON.parse(localStorage.getItem('planeTop10')||'[]')}catch(e){return[]}}
function saveScore(){let b=board();b.push({score,kills,time:+tm.toFixed(1),diff:dn[diff]});b.sort((a,b)=>b.score-a.score);localStorage.setItem('planeTop10',JSON.stringify(b.slice(0,10)))}
function sb(x,y){return Math.hypot(x-(W-60),y-(H-60))<40}
function use(){if(cd<=0&&sh<=0&&state==='play'){sh=300;cd=1200;bp(880,.3,.06);burst(p.x,p.y,'#4af',14,5)}}
function setPos(x,y,off){p.x=Math.max(p.r,Math.min(W-p.r,x));p.y=Math.max(p.r,Math.min(H-p.r,y-off))}
function down(x,y,off){
au();
if(state==='menu'){for(const b of btns)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){if(b.d===3){state='board';return}diff=b.d;reset();state='play';return}return}
if(state==='board'){state='menu';return}
if(state==='over'){state='menu';return}
if(sb(x,y)){use();return}
hold=true;setPos(x,y,off)}
c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];down(t.clientX,t.clientY,50)},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(hold&&state==='play'){const t=e.touches[0];setPos(t.clientX,t.clientY,50)}},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();hold=false},{passive:false});
c.addEventListener('mousedown',e=>down(e.clientX,e.clientY,0));
c.addEventListener('mousemove',e=>{if(hold&&state==='play')setPos(e.clientX,e.clientY,0)});
addEventListener('mouseup',()=>hold=false);
function efire(e){let sp=3.3+score/1200,t=e.type;
if(t=='s')eb.push({x:e.x,y:e.y+e.r,vx:0,vy:sp});
else if(t=='d'){eb.push({x:e.x-8,y:e.y+e.r,vx:0,vy:sp});eb.push({x:e.x+8,y:e.y+e.r,vx:0,vy:sp})}
else if(t=='t')for(let a=-.3;a<=.31;a+=.3)eb.push({x:e.x,y:e.y+e.r,vx:Math.sin(a)*sp,vy:Math.cos(a)*sp});
else if(t=='h'){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;eb.push({x:e.x,y:e.y+e.r,vx:dx/d*sp*.85,vy:dy/d*sp*.85})}
else if(t=='r')for(let a=0;a<6.28;a+=1.57)eb.push({x:e.x,y:e.y,vx:Math.cos(a)*sp*.6,vy:Math.sin(a)*sp*.6});
else if(t=='w')for(let i=-1;i<2;i++)eb.push({x:e.x+i*22,ox:e.x+i*22,y:e.y+e.r,vx:0,vy:sp*.9,ph:i*1.2,ty:'w'});
else if(t=='a')eb.push({x:e.x,y:e.y+e.r,vx:0,vy:sp*.5,ty:'a'});
else eb.push({x:e.x,y:e.y+e.r,vx:0,vy:sp*.75,life:42,ty:'p'})}
function spawnBoss(){
let per=[260,400,580][diff];
boss={x:W/2,y:-120,r:70,phase:0,phases:3,phaseHp:per,phaseMax:per,t:0,cd:60,dir:1,flash:0};
warnT=120;bp(80,.5,.08)}
function updateBoss(dt){
if(!boss)return;
boss.t+=dt;
if(boss.y<110)boss.y+=1.8*dt;
else{boss.x+=boss.dir*(1+boss.phase*0.5)*dt;
 if(boss.x>W-boss.r){boss.x=W-boss.r;boss.dir=-1}
 if(boss.x<boss.r){boss.x=boss.r;boss.dir=1}}
if(boss.flash>0)boss.flash-=dt;
if(boss.y>60){boss.cd-=dt;if(boss.cd<=0)bossFire()}}
function bossFire(){
const sp=3.3+diff*0.4;
const dx=p.x-boss.x,dy=p.y-boss.y,base=Math.atan2(dy,dx);
const r=Math.random();
if(boss.phase===0){
 if(r<0.55){
  for(let a=-0.7;a<=0.71;a+=0.35)eb.push({x:boss.x,y:boss.y+20,vx:Math.cos(base+a)*sp,vy:Math.sin(base+a)*sp,big:1,co:'#f6a'});
  boss.cd=22;
 }else{
  for(let i=0;i<14;i++){let a=boss.t*0.04+i*6.28/14;eb.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp*0.8,vy:Math.sin(a)*sp*0.8,big:1,co:'#c6f'})}
  boss.cd=26}
}else if(boss.phase===1){
 if(r<0.4){
  let n=22;
  for(let i=0;i<n;i++){let a=boss.t*0.06+i*6.28/n;eb.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp*0.9,vy:Math.sin(a)*sp*0.9,big:1,co:'#c6f'})}
  boss.cd=24;
 }else if(r<0.75){
  for(let a=-0.5;a<=0.51;a+=0.15)eb.push({x:boss.x,y:boss.y+20,vx:Math.cos(base+a)*sp*1.1,vy:Math.sin(base+a)*sp*1.1,big:1,co:'#ff3'});
  boss.cd=20;
 }else{
  for(let i=-1;i<=1;i++){let off=i*30;eb.push({x:boss.x+off,ox:boss.x+off,y:boss.y+20,vx:0,vy:sp*0.9,ph:i*1.5,ty:'w',big:1,co:'#8cf'})}
  boss.cd=24}
}else{
 if(r<0.35){
  for(let i=0;i<8;i++){let a=boss.t*0.18+i*6.28/8;eb.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,big:1,co:'#f55'})}
  for(let a=-0.25;a<=0.26;a+=0.12)eb.push({x:boss.x,y:boss.y+20,vx:Math.cos(base+a)*sp*1.35,vy:Math.sin(base+a)*sp*1.35,big:1,co:'#ff3'});
  boss.cd=14;
 }else if(r<0.65){
  let n=30;
  for(let i=0;i<n;i++){let a=boss.t*0.08+i*6.28/n;eb.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp*0.95,vy:Math.sin(a)*sp*0.95,big:1,co:'#f6a'})}
  boss.cd=22;
 }else{
  for(let a=-0.7;a<=0.71;a+=0.15)eb.push({x:boss.x,y:boss.y+20,vx:Math.cos(base+a)*sp*1.2,vy:Math.sin(base+a)*sp*1.2,big:1,co:'#ff3'});
  for(let i=0;i<10;i++){let a=boss.t*0.14+i*6.28/10;eb.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp*0.6,vy:Math.sin(a)*sp*0.6,big:1,co:'#f55'})}
  boss.cd=16}}
bp(300,.08,.03)}
function hurt(){if(inv>0||state!=='play'||sh>0)return;lives--;inv=90;bp(160,.25,.06);burst(p.x,p.y,'#f66',10,4);if(lives<=0){state='over';saveScore()}}
let last=0;
function loop(ts){
if(!last)last=ts;let dt=Math.min((ts-last)/16.67,3);last=ts;now=ts;
for(let i=0;i<stars.length;i++){let s=stars[i];s.y+=s.s*dt;if(s.y>H)s.y=0}
for(let i=parts.length-1;i>=0;i--){let pt=parts[i];pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=.05*dt;if(pt.life<=0)parts.splice(i,1)}
if(state==='play'){
 tm+=dt/60;
 if(inv>0)inv-=dt;if(sh>0)sh-=dt;if(cd>0)cd-=dt;if(warnT>0)warnT-=dt;if(healFx>0)healFx-=dt;
 let lv=1+Math.floor(score/LV_STEP);
 if(lv>prevLv){if(lv>6&&lives<maxLives){lives++;healFx=30;bp(880,.3,.05)}prevLv=lv}
 let fireGap=Math.max(4,9-Math.min(lv,6));
 fireT+=dt;
 if(fireT>fireGap){fireT=0;
  let n=Math.min(lv,3);
  for(let i=0;i<n;i++){let off=(i-(n-1)/2)*11;bullets.push({x:p.x+off,y:p.y-p.r,vx:off*.12,dmg:1})}
  bp(660,.05,.02)}
 if(!boss&&score>=bossThreshold)spawnBoss();
 if(!boss){
  spT+=dt;
  if(spT>Math.max(16,54-score/70)/dd[diff]){spT=0;
   let s=14+Math.random()*14;
   if(Math.random()<0.08){
    enemies.push({x:s+Math.random()*(W-2*s),y:-s,r:s+4,v:.9+Math.random()*.3,cd:999,type:'s',ph:Math.random()*6.28,hp:1,maxHp:1,flash:0,heal:1});
   }else{
    const type=pools[diff][Math.floor(Math.random()*pools[diff].length)];
    enemies.push({x:s+Math.random()*(W-2*s),y:-s,r:s,v:1.1+Math.random()*.8+Math.min(score/900,1),cd:45+Math.random()*45,type,ph:Math.random()*6.28,hp:cfg[type].hp,maxHp:cfg[type].hp,flash:0})}}}
 for(let i=0;i<enemies.length;i++){let e=enemies[i];
  e.cd-=dt;e.ph+=.05*dt;e.x+=Math.sin(e.ph)*2.2*dt;
  if(e.flash>0)e.flash-=dt;
  if(e.x<e.r)e.x=e.r;if(e.x>W-e.r)e.x=W-e.r;
  if(e.cd<=0&&e.y>0){e.cd=(Math.max(6,16-score/140)+Math.random()*6)*dc[diff];efire(e)}}
 updateBoss(dt);
 for(let i=0;i<bullets.length;i++){let b=bullets[i];b.y-=10*dt;b.x+=b.vx*dt}
 for(let i=0;i<enemies.length;i++)enemies[i].y+=enemies[i].v*dt;
 for(let i=0;i<eb.length;i++){let b=eb[i];
  if(b.ty=='w'){b.ph+=.2*dt;b.y+=b.vy*dt;b.x=b.ox+Math.sin(b.ph)*25}
  else if(b.ty=='a'){b.vy+=.16*dt;b.y+=b.vy*dt}
  else if(b.ty=='p'){b.life-=dt;b.y+=b.vy*dt;if(b.life<=0&&!b.dead){b.dead=true;for(let a=-.5;a<=.5;a+=.5)eb.push({x:b.x,y:b.y,vx:Math.sin(a)*3.2,vy:Math.cos(a)*3.5})}}
  else{b.x+=b.vx*dt;b.y+=b.vy*dt}}
 bullets=bullets.filter(b=>b.y>-10);
 enemies=enemies.filter(e=>{if(e.y+e.r>gy){if(!e.heal)hurt();return false}return e.y<H+e.r+20});
 eb=eb.filter(b=>!b.dead&&b.y<H+20&&b.y>-60&&b.x>-40&&b.x<W+40);
 for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];let hit=false;
  for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];
   if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+3){
    bullets.splice(i,1);e.hp-=b.dmg;e.flash=6;
    burst(b.x,b.y,'#4df',3);bp(440,.04,.02);
    if(e.hp<=0){
     if(e.heal){if(lives<maxLives){lives++;healFx=30}burst(e.x,e.y,'#4f8',14,5);bp(880,.3,.05)}
     else{score+=cfg[e.type].sc;burst(e.x,e.y,cfg[e.type].co,10,4);bp(520,.06,.03)}
     kills++;enemies.splice(j,1)}
    hit=true;break}}
  if(hit)continue}
 if(boss&&boss.y>-boss.r){
  for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];
   if(Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r+4){
    bullets.splice(i,1);boss.phaseHp-=b.dmg;boss.flash=5;
    burst(b.x,b.y,'#4df',3);bp(440,.03,.02);
    if(boss.phaseHp<=0){
     boss.phase++;
     if(boss.phase>=boss.phases){
      score+=800;kills++;
      burst(boss.x,boss.y,'#f6a',30,8);burst(boss.x,boss.y,'#ff3',20,6);
      bp(120,1,.1);boss=null;bossThreshold+=4000;break}
     else{boss.phaseHp=boss.phaseMax;bp(200,.5,.09);burst(boss.x,boss.y,'#f6a',25,7);boss.cd=30}}}}}
 for(let i=0;i<enemies.length;i++){let e=enemies[i];if(Math.hypot(p.x-e.x,p.y-e.y)<e.r+p.r-4)hurt()}
 if(boss&&Math.hypot(p.x-boss.x,p.y-boss.y)<boss.r+p.r)hurt();
 for(let i=0;i<eb.length;i++){let b=eb[i];if(Math.hypot(p.x-b.x,p.y-b.y)<p.r+(b.big?7:4))hurt()}
}
g.fillStyle='#05070f';g.fillRect(0,0,W,H);
let gr=g.createRadialGradient(W/2,H*.25,40,W/2,H*.25,W);
gr.addColorStop(0,'rgba(40,80,170,.28)');gr.addColorStop(1,'rgba(0,0,0,0)');
g.fillStyle=gr;g.fillRect(0,0,W,H);
g.fillStyle='#cfe';
for(let i=0;i<stars.length;i++){let s=stars[i];g.globalAlpha=.25+s.s/2.8;g.beginPath();g.arc(s.x,s.y,s.r,0,6.284);g.fill()}
g.globalAlpha=1;
if(state==='menu'){
 g.textAlign='center';g.textBaseline='middle';
 g.shadowBlur=24;g.shadowColor='#4af';g.fillStyle='#fff';g.font='bold 40px sans-serif';
 g.fillText('飞机大战',W/2,H/2-200);
 g.shadowBlur=0;g.fillStyle='#8cf';g.font='15px sans-serif';
 g.fillText('选择难度',W/2,H/2-155);
 btns.forEach((b,i)=>{
  let bg=g.createLinearGradient(b.x,b.y,b.x,b.y+b.h);
  if(i===3){bg.addColorStop(0,'#3a2a1a');bg.addColorStop(1,'#1a0f0a')}
  else{bg.addColorStop(0,'#1a3a5a');bg.addColorStop(1,'#0a1a2a')}
  g.fillStyle=bg;g.shadowBlur=14;g.shadowColor=i===3?'#fd6':'#4af';
  g.fillRect(b.x,b.y,b.w,b.h);g.shadowBlur=0;
  g.strokeStyle=i===3?'#fd6':'#4af';g.lineWidth=2;g.strokeRect(b.x,b.y,b.w,b.h);
  g.fillStyle='#fff';g.font='bold 20px sans-serif';
  g.fillText(i===3?'🏆 排行榜':dn[b.d],b.x+b.w/2,b.y+b.h/2)});
 requestAnimationFrame(loop);return}
if(state==='board'){
 g.textAlign='center';g.textBaseline='middle';
 g.shadowBlur=20;g.shadowColor='#fd6';g.fillStyle='#fd6';g.font='bold 30px sans-serif';
 g.fillText('🏆 历史最佳',W/2,80);
 g.shadowBlur=0;g.font='14px monospace';
 const bd=board();
 if(!bd.length){g.fillStyle='#888';g.font='16px sans-serif';g.fillText('暂无记录',W/2,H/2)}
 else{
  g.fillStyle='#8cf';g.textAlign='left';
  g.fillText('名次',W*.08,140);g.fillText('分数',W*.24,140);
  g.fillText('难度',W*.5,140);g.textAlign='right';g.fillText('存活',W*.92,140);
  bd.forEach((r,i)=>{
   const y=175+i*28;
   g.textAlign='left';
   g.fillStyle=i<3?['#fd6','#cdf','#fa8'][i]:'#aaa';
   g.fillText((i+1)+'.',W*.08,y);
   g.fillText(String(r.score),W*.24,y);
   g.fillText(r.diff,W*.5,y);
   g.textAlign='right';g.fillText(r.time+'s',W*.92,y)})}
   g.textAlign='center';g.fillStyle='#8cf';g.font='16px sans-serif';
 g.fillText('点击屏幕返回菜单',W/2,H-40);
 requestAnimationFrame(loop);return}
g.globalCompositeOperation='lighter';
for(let i=0;i<parts.length;i++){let pt=parts[i];g.globalAlpha=pt.life*.8;g.fillStyle=pt.co;
 g.beginPath();g.arc(pt.x,pt.y,(pt.r||3)*pt.life,0,6.284);g.fill()}
g.globalAlpha=1;g.globalCompositeOperation='source-over';
g.shadowBlur=12;g.shadowColor='#f80';g.strokeStyle='#f80';g.lineWidth=3;
g.beginPath();g.moveTo(0,gy);g.lineTo(W,gy);g.stroke();g.shadowBlur=0;
for(let i=0;i<bullets.length;i++){let b=bullets[i];
 g.fillStyle='#bff';g.shadowBlur=12;g.shadowColor='#4df';
 g.beginPath();g.ellipse(b.x,b.y-8,3,10,0,0,6.284);g.fill();
 g.fillStyle='#4df';g.globalAlpha=.6;g.shadowBlur=0;
 g.beginPath();g.ellipse(b.x,b.y-8,6,15,0,0,6.284);g.fill();g.globalAlpha=1}
g.shadowBlur=0;
for(let i=0;i<enemies.length;i++){let e=enemies[i];
 g.save();g.translate(e.x,e.y);
 let co=e.flash>0?'#fff':(e.heal?'#4f8':cfg[e.type].co);
 if(e.heal){g.globalCompositeOperation='lighter';g.globalAlpha=.4;
  g.fillStyle='#4f8';g.beginPath();g.arc(0,0,e.r*1.6,0,6.284);g.fill();
  g.globalAlpha=1;g.globalCompositeOperation='source-over'}
 g.globalAlpha=.45+.55*(e.hp/e.maxHp);
 g.fillStyle=co;g.shadowBlur=14;g.shadowColor=co;
 let r=e.r;
 if(e.heal){g.beginPath();for(let k=0;k<12;k++){let a=k*Math.PI/6;let rr=k%2===0?r:r*.55;g[k===0?'moveTo':'lineTo'](Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill();
  g.fillStyle='#0f4';g.beginPath();g.arc(0,0,r*.3,0,6.284);g.fill()}
 else if(e.type==='p'){g.beginPath();for(let k=0;k<10;k++){let a=-Math.PI/2+k*Math.PI/5;let rr=k%2===0?r:r*.5;g[k===0?'moveTo':'lineTo'](Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill();
  g.fillStyle='#000a';g.beginPath();g.arc(0,0,r*.3,0,6.284);g.fill()}
