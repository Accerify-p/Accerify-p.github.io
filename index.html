<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>飞机大战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05070f;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;
 touch-action:none;-webkit-user-select:none;user-select:none}
#c{display:block;position:fixed;top:0;left:0;z-index:0}
#hud{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:5;font-size:14px}
#hudLeft{position:absolute;top:14px;left:14px}
#hudLeft>div{margin-bottom:6px}
.score-line{font-size:18px;font-weight:700;text-shadow:0 0 12px rgba(74,170,255,.8)}
.score-line b{color:#8cf}
.meta-line{font-size:12px;color:#8cf;opacity:.9}
.xp-bar{width:160px;height:6px;background:rgba(0,0,0,.55);border-radius:3px;overflow:hidden}
.xp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4af,#8cf);transition:width .15s}
.boss-cd{font-size:11px;color:#f6a;min-height:14px}
.lives{position:absolute;top:14px;right:14px;font-size:18px;letter-spacing:1px}
.lives span{color:#f66;text-shadow:0 0 8px rgba(255,102,102,.85)}
.lives span.off{color:#333;text-shadow:none}
#skillBtn{position:absolute;right:16px;bottom:24px;width:74px;height:74px;border-radius:50%;
 border:2px solid #2a8;background:radial-gradient(circle at 30% 30%,#6fd,#186);
 color:#fff;font-size:22px;font-weight:700;pointer-events:auto;font-family:inherit;
 box-shadow:0 0 20px rgba(42,168,136,.6);outline:none}
#skillBtn.cool{background:radial-gradient(circle at 30% 30%,#555,#222);
 border-color:#333;box-shadow:none;color:#aaa;font-size:15px}
#skillBtn.shield{background:radial-gradient(circle at 30% 30%,#8cf,#25a);
 border-color:#4af;box-shadow:0 0 26px rgba(74,170,255,.85)}
.boss-bar{position:absolute;top:100px;left:14px;width:190px;height:9px;display:none;gap:2px;
 padding:1.5px;background:rgba(0,0,0,.55);border:1px solid rgba(246,106,170,.35);
 border-radius:5px}
.boss-bar.show{display:flex}
.boss-bar .seg{flex:1;background:rgba(0,0,0,.75);border-radius:3px;overflow:hidden}
.boss-bar .seg i{display:block;height:100%;width:100%;
 background:linear-gradient(180deg,#ff8,#f6a 45%,#f55);transition:width .12s}
.boss-bar .seg.done{opacity:.3}
.boss-bar .seg.done i{background:#555}
.boss-label{position:absolute;top:114px;left:14px;color:#f6a;font-size:11px;
 font-weight:600;display:none}
.boss-label.show{display:block}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;display:none;
 align-items:center;justify-content:center;padding:20px;
 background:radial-gradient(ellipse at center,rgba(5,10,25,.9),rgba(2,4,10,.98))}
.overlay.show{display:flex}
.panel{background:linear-gradient(160deg,rgba(20,40,70,.95),rgba(8,16,32,.97));
 border:1px solid rgba(74,170,255,.35);border-radius:18px;padding:28px 22px;text-align:center;
 width:100%;max-width:340px;box-shadow:0 0 50px rgba(74,170,255,.28)}
.panel h1{font-size:32px;margin-bottom:8px;letter-spacing:2px;
 background:linear-gradient(90deg,#8cf,#4af,#f6a);-webkit-background-clip:text;background-clip:text;
 -webkit-text-fill-color:transparent;color:#8cf}
.panel h2{font-size:22px;margin-bottom:14px;text-shadow:0 0 18px rgba(74,170,255,.7)}
.panel h3{font-size:14px;margin:12px 0 6px;color:#8cf;font-weight:500}
.panel .sub{color:#8cf;margin-bottom:18px;font-size:14px}
.panel .hint{margin-top:14px;font-size:11px;color:#fd6;opacity:.85}
.panel .over-stat{color:#8cf;font-size:13px;margin-bottom:4px}
.panel button{display:block;width:100%;margin:8px 0;padding:13px;
 border:1px solid rgba(74,170,255,.4);border-radius:10px;cursor:pointer;font-family:inherit;
 background:linear-gradient(135deg,rgba(26,58,90,.9),rgba(10,26,42,.9));
 color:#fff;font-size:16px;font-weight:600}
.panel button:active{transform:scale(.98)}
.panel button.gold{background:linear-gradient(135deg,rgba(90,60,20,.9),rgba(40,24,8,.95));
 border-color:rgba(253,214,102,.5);color:#fd6}
.board-table{margin:8px 0;font-size:12px;font-family:monospace;max-height:220px;overflow-y:auto;text-align:left}
.board-table .row{display:grid;grid-template-columns:26px 1fr 54px 46px;padding:5px 6px;border-radius:5px}
.board-table .row:nth-child(odd){background:rgba(74,170,255,.06)}
.board-table .row.head{color:#8cf;font-weight:600;background:none}
.board-table .r1{color:#fd6}
.board-table .r2{color:#cdf}
.board-table .r3{color:#fa8}
.board-table .empty{color:#888;text-align:center;padding:18px;font-family:inherit}
#errBox{position:fixed;top:0;left:0;right:0;z-index:999;background:#c00;color:#fff;
 font-size:11px;padding:6px 10px;display:none;white-space:pre-wrap;max-height:40%;overflow-y:auto}
</style>
</head>
<body>
<div id="errBox"></div>
<canvas id="c"></canvas>

<div id="hud">
  <div id="hudLeft">
    <div class="score-line">分数 <b id="hScore">0</b></div>
    <div class="meta-line" id="hMeta">Lv1/7 · DMG1 · 简单</div>
    <div class="xp-bar"><i id="hXp"></i></div>
    <div class="boss-cd" id="hBossCd"></div>
  </div>
  <div class="lives" id="hLives"></div>
  <button id="skillBtn" type="button">⚡</button>
  <div class="boss-bar" id="bossBar">
    <div class="seg"><i></i></div><div class="seg"><i></i></div><div class="seg"><i></i></div>
  </div>
  <div class="boss-label" id="bossLabel"></div>
</div>

<div class="overlay" id="ovMenu">
  <div class="panel">
    <h1>飞机大战</h1>
    <p class="sub">选择难度</p>
    <button type="button" data-d="0">简单</button>
    <button type="button" data-d="1">中等</button>
    <button type="button" data-d="2">困难</button>
    <button type="button" class="gold" data-a="board">🏆 排行榜</button>
    <p class="hint">WASD 移动 · 空格放技能 · 触屏拖动也可</p>
  </div>
</div>

<div class="overlay" id="ovBoard">
  <div class="panel">
    <h2>🏆 历史最佳</h2>
    <div class="board-table" id="boardTable"></div>
    <button type="button" data-a="menu">返回菜单</button>
  </div>
</div>

<div class="overlay" id="ovOver">
  <div class="panel">
    <h2>游戏结束</h2>
    <p class="over-stat" id="overStat"></p>
    <h3>历史最佳</h3>
    <div class="board-table" id="overBoard"></div>
    <button type="button" data-a="menu">返回菜单</button>
  </div>
</div>

<div class="overlay" id="ovWin">
  <div class="panel">
    <h1>🎉 通关 🎉</h1>
    <p class="over-stat" id="winStat"></p>
    <h3>历史最佳</h3>
    <div class="board-table" id="winBoard"></div>
    <button type="button" data-a="menu">返回菜单</button>
  </div>
</div>

<script>
(function(){
'use strict';

var errBox=document.getElementById('errBox');
function showErr(msg){errBox.style.display='block';errBox.textContent+=(errBox.textContent?'\n':'')+msg}
window.onerror=function(m,s,l){showErr('错误: '+m+' (第'+l+'行)')};

var c=document.getElementById('c'),g=c.getContext('2d');
var $=function(id){return document.getElementById(id)};
var dom={
 menu:$('ovMenu'),board:$('ovBoard'),over:$('ovOver'),win:$('ovWin'),
 boardTable:$('boardTable'),overBoard:$('overBoard'),overStat:$('overStat'),
 winStat:$('winStat'),winBoard:$('winBoard'),
 hScore:$('hScore'),hMeta:$('hMeta'),hXp:$('hXp'),
 hLives:$('hLives'),hBossCd:$('hBossCd'),
 skill:$('skillBtn'),bossBar:$('bossBar'),bossLabel:$('bossLabel')
};

var W=0,H=0,gy=0,stars=[],parts=[],rings=[],keys={},now=0;
function rs(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;gy=H-60;
 stars=[];for(var i=0;i<60;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,s:Math.random()*1.2+.3})}
rs();window.addEventListener('resize',rs);

var ac=null,mu=null,bgm=null;
function au(){
 try{
  if(!ac){
   var AC=window.AudioContext||window.webkitAudioContext;
   if(AC){ac=new AC();mu=ac.createGain();mu.gain.value=.05;mu.connect(ac.destination)}
  }
  if(ac&&ac.state==='suspended')ac.resume();
 }catch(e){}
 try{
  if(!bgm){bgm=new Audio('bgm.mp3');bgm.loop=true;bgm.volume=.35;
   bgm.addEventListener('error',function(){})}
  if(bgm.paused){var pr=bgm.play();if(pr&&pr.catch)pr.catch(function(){})}
 }catch(e){}
}
document.addEventListener('visibilitychange',function(){
 if(!bgm)return;
 if(document.hidden){bgm.pause()}
 else if(state==='play'){var pr=bgm.play();if(pr&&pr.catch)pr.catch(function(){})}
});
function bp(f,d,v,type,slide){
 if(!ac)return;
 try{
  var o=ac.createOscillator(),n=ac.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f,ac.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(slide,20),ac.currentTime+d);
  n.gain.setValueAtTime(0,ac.currentTime);
  n.gain.linearRampToValueAtTime(v||.03,ac.currentTime+.006);
  n.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
  o.connect(n);n.connect(ac.destination);
  o.start();o.stop(ac.currentTime+d+.05);
 }catch(e){}
}
function burst(x,y,co,n,sp){
 if(parts.length>80)return;sp=sp||3;n=Math.min(n,8);
 for(var i=0;i<n;i++){var a=Math.random()*6.28,s=1+Math.random()*sp;
  parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,co:co,r:2+Math.random()*2})}
}
function shock(x,y,co,n){n=n||1;for(var i=0;i<n;i++)rings.push({x:x,y:y,r:4+i*6,life:1,co:co})}

var cfg={
 s:{sc:10,co:'#f55',hp:2},d:{sc:15,co:'#f88',hp:3},t:{sc:20,co:'#fa5',hp:4},
 h:{sc:25,co:'#c6f',hp:5},r:{sc:25,co:'#ff3',hp:5},w:{sc:30,co:'#8cf',hp:6},
 a:{sc:30,co:'#4fa',hp:6},p:{sc:40,co:'#f6a',hp:8},
 x:{sc:35,co:'#f9c',hp:4},v:{sc:35,co:'#9cf',hp:5}};
var pools=[
 ['s','s','d','d','t','t','t'],
 ['s','d','t','t','t','h','h','h','r','r','w','w','w','x','v'],
 ['s','d','t','t','h','h','h','r','r','r','w','w','w','a','a','a','p','p','p','x','x','v','v']];
var dn=['简单','中等','困难'],dd=[.75,1,1.3],dc=[1.5,1,.8];
var LV_REQ=[0,0,400,900,1600,2600,4000,6500],MAX_LV=7,MAX_BOSS=5;

function getLv(s){for(var i=MAX_LV;i>=1;i--){if(s>=LV_REQ[i])return i}return 1}
function getCols(lv){return lv>=MAX_LV?3:(lv>=4?2:1)}
function getFireGap(lv){return Math.max(3,8-(lv-1))}
function getSpread(lv){return Math.max(0.035,0.14-(lv-1)*0.017)}
function getDmg(lv){return Math.min(5,1+Math.floor((lv-1)*0.7))}

var diff=0,state='menu',prevLv=1;
var p={x:0,y:0,r:16,hr:10},bullets=[],enemies=[],eb=[],score=0,fireT=0,spT=0,hold=false,
 lives=3,maxLives=7,inv=0,sh=0,cd=0,kills=0,tm=0,boss=null,bossDefeated=0,
 nextBossTime=60,bossCount=0,warnT=0,healFx=0;

function reset(){
 p.x=W/2;p.y=H-90;
 bullets=[];enemies=[];eb=[];parts=[];rings=[];
 score=0;fireT=0;spT=0;lives=3;inv=0;sh=0;cd=0;kills=0;tm=0;
 boss=null;bossDefeated=0;nextBossTime=60;bossCount=0;warnT=0;healFx=0;prevLv=1;
}
reset();

function setState(s){
 state=s;
 dom.menu.classList.toggle('show',s==='menu');
 dom.board.classList.toggle('show',s==='board');
 dom.over.classList.toggle('show',s==='over');
 dom.win.classList.toggle('show',s==='win');
 if(s==='board'||s==='over'||s==='win'){
  var bd=board();
  var html=bd.length?boardHTML(bd):'<div class="empty">暂无记录</div>';
  if(s==='board')dom.boardTable.innerHTML=html;
  else if(s==='over')dom.overBoard.innerHTML=html;
  else dom.winBoard.innerHTML=html;
 }
}
function boardHTML(bd){
 var h='<div class="row head"><span>#</span><span>分数</span><span>难度</span><span>存活</span></div>';
 for(var i=0;i<bd.length;i++){
  var r=bd[i];var cls=i===0?'r1':i===1?'r2':i===2?'r3':'';
  h+='<div class="row"><span class="'+cls+'">'+(i+1)+'.</span><span>'+r.score+'</span><span>'+r.diff+'</span><span>'+r.time+'s</span></div>';
 }
 return h;
}
function board(){try{return JSON.parse(localStorage.getItem('planeTop10')||'[]')}catch(e){return[]}}
function saveScore(){
 var b=board();
 b.push({score:score,kills:kills,time:+tm.toFixed(1),diff:dn[diff]});
 b.sort(function(a,b){return b.score-a.score});
 try{localStorage.setItem('planeTop10',JSON.stringify(b.slice(0,10)))}catch(e){}
}

function use(){
 if(cd<=0&&sh<=0&&state==='play'){
  sh=300;cd=1200;bp(380,.32,.04,'sine',950);
  burst(p.x,p.y,'#4af',14,5);shock(p.x,p.y,'#4af',2);
 }
}

function handleBtn(e){
 var el=e.target;
 while(el&&el!==document){
  if(el.dataset){
if(el.dataset.d!==undefined){
 au();diff=+el.dataset.d;reset();setState('play');
 if(bgm){bgm.currentTime=0;var pr=bgm.play();if(pr&&pr.catch)pr.catch(function(){})}
 return;
}
  }
  el=el.parentNode;
 }
 if(e.target.id==='skillBtn'){au();use()}
}
document.addEventListener('click',handleBtn);

function setPos(x,y,off){
 p.x=Math.max(p.r,Math.min(W-p.r,x));
 p.y=Math.max(p.r,Math.min(H-p.r,y-off));
}
c.addEventListener('touchstart',function(e){
 e.preventDefault();au();
 if(state!=='play')return;
 var t=e.touches[0];hold=true;setPos(t.clientX,t.clientY,50);
},{passive:false});
c.addEventListener('touchmove',function(e){
 e.preventDefault();
 if(hold&&state==='play'){var t=e.touches[0];setPos(t.clientX,t.clientY,50)}
},{passive:false});
c.addEventListener('touchend',function(e){e.preventDefault();hold=false},{passive:false});
c.addEventListener('mousedown',function(e){
 au();if(state!=='play')return;hold=true;setPos(e.clientX,e.clientY,0);
});
c.addEventListener('mousemove',function(e){
 if(hold&&state==='play')setPos(e.clientX,e.clientY,0);
});
window.addEventListener('mouseup',function(){hold=false});

window.addEventListener('keydown',function(e){
 var k=e.key.toLowerCase();
 keys[k]=true;
 if(k===' '||k==='j'||k==='k'){e.preventDefault();au();use()}
 if(k==='w'||k==='a'||k==='s'||k==='d'||k==='arrowup'||k==='arrowdown'||k==='arrowleft'||k==='arrowright'){e.preventDefault()}
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});

function efire(e){
 var sp=3.3+score/1200,t=e.type,i,a;
 if(t==='s')eb.push({x:e.x,y:e.y+e.r,vx:0,vy:sp});
 else if(t==='d'){eb.push({x:e.x-8,y:e.y+e.r,vx:0,vy:sp});eb.push({x:e.x+8,y:e.y+e.r,vx:0,vy:sp})}
 else if(t==='t')for(a=-.3;a<=.31;a+=.3)eb.push({x:e.x,y:e.y+e.r,vx:Math.sin(a)*sp,vy:Math.cos(a)*sp});
 else if(t==='h'){var dx=p.x-e.x,dy=p.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;eb.push({x:e.x,y:e.y+e.r,vx:dx/d*sp*.85,vy:dy/d*sp*.85})}
 else if(t==='r')for(a=0;a<6.28;a+=1.57)eb.push({x:e.x,y:e.y,vx:Math.cos(a)*sp*.6,vy:Math.sin(a)*sp*.6});
 else if(t==='w')for(i=-1;i<2;i++)eb.push({x:e.x+i*22,ox:e.x+i*22,y:e.y+e.r,vx:0,vy:sp*.9,ph:i*1.2,ty:'w'});
 else if(t==='a')eb.push({x:e.x,y:e.y+e.r,vx:0,vy:sp*.5,ty:'a'});
 else if(t==='x'){for(a=0;a<4;a++){var ang=Math.PI/4+a*Math.PI/2;
  eb.push({x:e.x,y:e.y,vx:Math.cos(ang)*sp*.8,vy:Math.sin(ang)*sp*.8,co:'#f9c'})}}
 else if(t==='v'){for(a=-.5;a<=.51;a+=.5)eb.push({x:e.x,y:e.y+e.r,vx:Math.sin(a)*sp,vy:Math.cos(a)*sp,co:'#9cf'})}
 else eb.push({x:e.x,y:e.y+e.r,vx:0,vy:sp*.75,life:42,ty:'p'});
}

function spawnBoss(){
 bossCount++;
 var scale=1+(bossCount-1)*0.4;
 var per=Math.floor([260,380,520][diff]*scale);
 boss={x:W/2,y:-120,r:70,phase:0,phases:3,phaseHp:per,phaseMax:per,
  t:0,cd:60,dir:1,flash:0,num:bossCount,dmgAcc:0};
 warnT=120;bp(70,.8,.065,'sawtooth',35);
}
function updateBoss(dt){
 if(!boss)return;
 boss.t+=dt;
 if(boss.y<110)boss.y+=1.8*dt;
 else{
  boss.x+=boss.dir*(1+boss.phase*0.5)*dt;
  if(boss.x>W-boss.r){boss.x=W-boss.r;boss.dir=-1}
  if(boss.x<boss.r){boss.x=boss.r;boss.dir=1}
 }
 if(boss.flash>0)boss.flash-=dt;
 if(boss.y>60){boss.cd-=dt;if(boss.cd<=0)bossFire()}
}
function bossFire(){
 var cm=1-(boss.num-1)*0.08;
 var sp=(3.3+diff*0.4)*(1+(boss.num-1)*0.05);
 var dx=p.x-boss.x,dy=p.y-boss.y,base=Math.atan2(dy,dx),r=Math.random(),i,a,k;
 if(boss.phase===0){
  if(r<0.4){for(a=-0.7;a<=0.71;a+=0.35)eb.push({x:boss.x,y:boss.y+20,vx:Math.cos(base+a)*sp,vy:Math.sin(base+a)*sp,big:1,co:'#f6a'});boss.cd=Math.round(42*cm)}
  else if(r<0.75){for(i=0;i<14;i++){a=boss.t*0.04+i*6.28/14;eb.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp*0.8,vy:Math.sin(a)*sp*0.8,big:1,co:'#c6f'})}boss.cd=Math.round(46*cm)}
  else{for(i=0;i<6;i++){a=i*6.28/6+boss.t*0.08;for(k=0;k<2;k++)eb.push({x:boss.x,y:boss.y,vx:Math.cos(a+k*3.14)*sp*.9,vy:Math.sin(a+k*3.14)*sp*.9,big:1,co:'#ff3'})}boss.cd=Math.round(50*cm)}
 }else if(boss.phase===1){
  if(r<0.3){for(i=0;i<22;i++){a=boss.t*0.06+i*6.28/22;eb.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp*0.9,vy:Math.sin(a)*sp*0.9,big:1,co:'#c6f'})}boss.cd=Math.round(44*cm)}
  else if(r<0.55){for(a=-0.5;a<=0.51;a+=0.15)eb.push({x:boss.x,y:boss.y+20,vx:Math.cos(base+a)*sp*1.1,vy:Math.sin(base+a)*sp*1.1,big:1,co:'#ff3'});boss.cd=Math.round(42*cm)}
  else if(r<0.8){for(i=-1;i<=1;i++){var off=i*30;eb.push({x:boss.x+off,ox:boss.x+off,y:boss.y+20,vx:0,vy:sp*0.9,ph:i*1.5,ty:'w',big:1,co:'#8cf'})}boss.cd=Math.round(44*cm)}
  else{for(i=-1;i<=1;i++){a=base+i*0.25;eb.push({x:boss.x,y:boss.y+20,vx:Math.cos(a)*sp*1.3,vy:Math.sin(a)*sp*1.3,big:1,co:'#f55'})}boss.cd=Math.round(46*cm)}
 }else{
